# Auto-loaded by `docker compose up` for development.
# Overrides production compose with:
#  - source bind mount on web (live PHP edits)
#  - Tailwind watcher rebuilding output.css on .php changes
#  - BrowserSync proxy con live-reload su PHP/JS/CSS

services:
  web:
    volumes:
      - ./:/var/www/html
      - giocate_data:/var/www/html/giocate

  tailwind:
    build:
      context: .
      dockerfile: Dockerfile
      target: tailwind-builder
    image: gdrcd-tailwind:latest
    container_name: gdrcd-tailwind
    working_dir: /build
    volumes:
      - ./:/build
    command: ["bash", "/build/docker/tailwind-watch.sh", "/build"]
    restart: unless-stopped

  browsersync:
    image: node:20-alpine
    container_name: gdrcd-browsersync
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -c "if ! command -v browser-sync >/dev/null; then npm install -g browser-sync; fi &&
             browser-sync start
             --proxy 'gdrcd-web'
             --files '**/*.php,**/*.inc.php,includes/*.js,themes/tailwind/output.css'
             --no-notify
             --no-open
             --port 3000
             --ui-port 3001
             --reload-debounce 500"
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      - web
      - tailwind
    restart: unless-stopped

  # WebSocket chat server (Ratchet). Polla il DB ogni ~1s e pusha i nuovi
  # messaggi chat ai client connessi. Sostituisce il polling HTTP di
  # /api/chat.inc.php. Fallback automatico al polling lato client se il
  # servizio non e' raggiungibile (vedi includes/chat.js).
  gdrcd-ws:
    build:
      context: .
      dockerfile: docker/Dockerfile.ws
    image: gdrcd-ws:latest
    container_name: gdrcd-ws
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      GDRCD_DB_HOST: db
      GDRCD_DB_NAME: gdrcd
      GDRCD_DB_USER: gdrcd
      GDRCD_DB_PASSWORD: gdrcd
      GDRCD_WS_HOST: 0.0.0.0
      GDRCD_WS_PORT: 8082
      GDRCD_WS_TICK: 1.0
    ports:
      - "8082:8082"
    depends_on:
      - db
      - web
    restart: unless-stopped
