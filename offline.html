<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#a47e3b">
    <title>Sei offline · GDRCD</title>
    <link rel="shortcut icon" href="/imgs/favicon.ico" type="image/x-icon">
    <style>
        :root {
            --gdrcd-bg: #f8f7f4;
            --gdrcd-panel: #ffffff;
            --gdrcd-text: #2b2723;
            --gdrcd-text-soft: #6f655c;
            --gdrcd-border: #e6dfd5;
            --gdrcd-accent: #a47e3b;
            --gdrcd-accent-soft: #f1e5cd;
            --gdrcd-accent-strong: #8c6a2d;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --gdrcd-bg: #1c1a17;
                --gdrcd-panel: #25221e;
                --gdrcd-text: #ece6dc;
                --gdrcd-text-soft: #a89e8f;
                --gdrcd-border: #3a342c;
                --gdrcd-accent-soft: #3a2f1a;
            }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--gdrcd-bg);
            color: var(--gdrcd-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background: var(--gdrcd-panel);
            border: 1px solid var(--gdrcd-border);
            border-radius: 0.75rem;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
            max-width: 28rem;
            width: 100%;
            padding: 2rem;
            text-align: center;
        }
        .icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 4rem;
            height: 4rem;
            border-radius: 9999px;
            background: var(--gdrcd-accent-soft);
            color: var(--gdrcd-accent);
            margin-bottom: 1.25rem;
        }
        .icon-wrap svg { width: 2rem; height: 2rem; }
        h1 {
            font-family: 'Cinzel', Georgia, serif;
            font-size: 1.5rem;
            margin: 0 0 0.5rem;
            color: var(--gdrcd-text);
        }
        p {
            margin: 0 0 1.5rem;
            color: var(--gdrcd-text-soft);
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--gdrcd-accent);
            color: #fff;
            border: 0;
            border-radius: 0.5rem;
            padding: 0.625rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s ease;
        }
        .btn:hover, .btn:focus { background: var(--gdrcd-accent-strong); }
        .btn svg { width: 1rem; height: 1rem; }
        .hint {
            margin-top: 1.25rem;
            font-size: 0.8rem;
            color: var(--gdrcd-text-soft);
        }
    </style>
</head>
<body>
    <main class="card" role="main">
        <div class="icon-wrap" aria-hidden="true">
            <!-- cloud-off icon -->
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M3 3l18 18M9.17 5.17A6 6 0 0119 9a4 4 0 011.86 7.55M15 19H7a5 5 0 01-1.9-9.62"/>
            </svg>
        </div>
        <h1>Sei offline</h1>
        <p>Riconnettiti per continuare a giocare. Quando la rete tornerà disponibile potrai riprendere da dove avevi lasciato.</p>
        <button type="button" class="btn" onclick="window.location.reload()">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M4 4v6h6M20 20v-6h-6M20 9a8 8 0 00-14.93-2M4 15a8 8 0 0014.93 2"/>
            </svg>
            Riprova
        </button>
        <div class="hint">GDRCD &middot; modalità offline</div>
    </main>
</body>
</html>
